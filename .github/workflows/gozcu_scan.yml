name: GOZCU Tarama

# GOZCU, paper trading'den TAMAMEN bagimsiz bir izleme panelidir (al-sat
# sinyali uretmez). Bu workflow gozcu/scanner.py'yi periyodik calistirip
# sonucu gozcu/data/snapshot.json'a commit'ler - dashboard SADECE bu
# dosyayi okur, kendi basina yfinance'e hicbir zaman gitmez (bkz.
# gozcu/scanner.py modul docstring'i, "Bolum 0" mimari kararu, README
# "GOZCU mimarisi" bolumu).
#
# Zamanlama mantigi: GitHub Actions cron'u UTC'dir ve DST'yi KENDISI
# kaydirmaz. TR'de DST yok ama ABD/NASDAQ'ta var; bunu cron'da iki ayri
# satirla (yaz/kis) yonetmek yerine, cron GENIS bir UTC penceresinde
# (06:00-21:00, hafta ici, 5 dakikada bir - GitHub Actions'in pratik
# minimum araligi) tetiklenir ve gozcu/scanner.py icindeki
# gozcu/market_hours.py (zoneinfo, DST-farkinda) HANGI piyasa(lar)in
# GERCEKTEN acik oldugunu kontrol edip SADECE onlari tarar. Piyasa
# kapaliyken bosuna yfinance'e gidilmez.
on:
  schedule:
    - cron: "*/5 6-21 * * 1-5"
  workflow_dispatch: {} # Actions sekmesinden elle tetikleme imkani

# Ayni snapshot.json/alert_state.json uzerinde cakisan calistirmalari
# onlemek icin seri kuyruk (paper_trading.yml ile ayni desen).
concurrency:
  group: gozcu-scan
  cancel-in-progress: false

# GITHUB_TOKEN'in snapshot degisikliklerini repoya geri push'layabilmesi
# icin YAZMA izni sart (ayni repo icin paper_trading.yml'de zaten acik
# olmasi gerekiyor - bkz. README "Kurulum").
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Testleri calistir (guvenlik onlemi - basarisizsa dur, snapshot'a dokunma)
        run: python -m pytest -q

      - name: GOZCU taramasi calistir (BIST + NASDAQ, piyasa acik kontrolu script icinde)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m gozcu.scanner --market all

      - name: Action Sheet canli fiyatlarini guncelle (sadece acik pozisyonlar, GOZCU'nun ayni toplu-fetch altyapisiyla)
        # paper_trading.yml gunde bir tam formu (giris/stop/miktar mantigi)
        # uretiyor - bu adim o formu YENIDEN URETMEZ, sadece fiyat-bagimli
        # alanlari (guncel fiyat, stop mesafesi, P&L) bu is akisinin ZATEN
        # var olan ~2 dakikalik harici tetikleme dongusunde (cron-job.org)
        # tazeler (bkz. paper_trading/action_sheet.py::refresh_live_prices
        # docstring'i). action_sheet.json henuz hic olusmadiysa (ilk gunluk
        # calistirma once gelmeli) sessizce atlanir.
        run: python -m paper_trading.action_sheet --refresh-live-prices

      - name: Snapshot ve Action Sheet fiyat degisikliklerini commit'le ve pushla
        # Harici zamanlayici (cron-job.org) 2 dakikada bir workflow_dispatch
        # tetikledigi icin (bkz. README "Harici tetikleyici"), ardisik iki
        # calistirma bazen COK yakin gelip concurrency kuyruguna ragmen
        # push ANI'nda remote'un zaten ilerlemis olmasina yol acabiliyor
        # (2026-08-12 canli gozlemi: "! [rejected] main -> main (fetch
        # first)"). Bu dosyalar HER calistirmada TAMAMEN yeniden uretilir -
        # iki taramanin verisini SATIR BAZINDA birlestirmek (rebase/merge)
        # anlamsiz VE cakisma riski tasir; dogru davranis "en TAZE tarama
        # HER ZAMAN kazanir"dir. Bu yuzden cakisma olursa: bu calistirmanin
        # TARADIGI veriyi (git durumundan BAGIMSIZ bir yedekten) remote'un
        # EN SON commit'inin USTUNE yeniden uygulayip tekrar denenir (en
        # fazla 5 kez).
        #
        # COMMIT-DEBOUNCE (2026-08-13, Vercel deploy-kotasi tukendigi icin
        # eklendi - bkz. ilgili konusma): HER 2 dakikalik tarama artik HER
        # ZAMAN commit/push YAPMAZ - Vercel "her push = yeni deploy"
        # tetikledigi icin (dashboard/next.config.ts::outputFileTracingIncludes,
        # veri build-time'a gomulur - bkz. ilgili konusma, bu KOK NEDEN),
        # 2 dk'da bir push GUNDE ~350+ deploy demek, Hobby plan kotasini
        # tukettiyor ("Deployment rate limited"). Tarama/skorlama/Telegram
        # "dikkat" uyarisi mantigi DEGISMEDI (HER ZAMAN 2 dk'da bir calisir,
        # bkz. yukaridaki adim) - SADECE git'e YAZMA/PUSH sikligi ayrildi:
        # DEBOUNCE_SECONDS (varsayilan 900s = 15dk) gecmediyse push atlanir.
        # ISTISNA: alert_state.json DEGISTIYSE (yani bu calistirma yeni bir
        # Telegram "dikkat" uyarisi gonderdiyse) debounce ATLANIR, HER ZAMAN
        # hemen commit'lenir - aksi halde bir sonraki calistirma (2 dk sonra)
        # ESKI (henuz commit'lenmemis) alert_state.json'dan basladigi icin
        # AYNI sembole tekrar-tekrar uyari gonderebilirdi (idempotency
        # SADECE commit'lenmis state'e dayanir). Bu, dashboard veri
        # tazeliginden (~5-6dk -> ~15-30dk, kabul edilen bir odun) BAGIMSIZ
        # olarak Telegram bildirimlerinin dogrulugunu KORUR.
        run: |
          git config user.name "gozcu-bot"
          git config user.email "actions@users.noreply.github.com"

          DEBOUNCE_SECONDS=900

          TRACKED_FILES="gozcu/data/snapshot.json gozcu/data/alert_state.json paper_trading/logs/action_sheet.json"
          existing_files() {
            for f in $TRACKED_FILES; do
              [ -f "$f" ] && echo "$f"
            done
          }

          git add $(existing_files)
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atlaniyor."
            exit 0
          fi

          if git diff --cached --quiet -- gozcu/data/alert_state.json; then
            LAST_COMMIT_TS=$(git log -1 --format=%ct -- gozcu/data/snapshot.json 2>/dev/null || echo 0)
            NOW_TS=$(date -u +%s)
            ELAPSED=$((NOW_TS - LAST_COMMIT_TS))
            if [ "$LAST_COMMIT_TS" != "0" ] && [ "$ELAPSED" -lt "$DEBOUNCE_SECONDS" ]; then
              echo "Son commit ${ELAPSED}sn once yapildi (esik: ${DEBOUNCE_SECONDS}sn), alert_state.json degismedi - push atlaniyor (Vercel deploy-kotasi tasarrufu)."
              git reset
              exit 0
            fi
          else
            echo "alert_state.json degisti (yeni bir Telegram uyarisi gonderilmis olabilir) - debounce ATLANIYOR, hemen commit'leniyor."
          fi

          backup_dir="$(mktemp -d)"
          for f in $(existing_files); do
            mkdir -p "$backup_dir/$(dirname "$f")"
            cp "$f" "$backup_dir/$f"
          done

          git commit -m "gozcu: otomatik tarama $(date -u +'%Y-%m-%d %H:%M UTC')"

          max_attempts=5
          attempt=1
          pushed=0
          while [ "$attempt" -le "$max_attempts" ]; do
            if git push; then
              echo "Push basarili (deneme $attempt/$max_attempts)."
              pushed=1
              break
            fi
            echo "Push basarisiz (deneme $attempt/$max_attempts) - remote guncellenmis, senkronize edilip bu calistirmanin verisiyle tekrar denenecek."
            git fetch origin main
            git reset --hard origin/main
            for f in $TRACKED_FILES; do
              [ -f "$backup_dir/$f" ] && cp "$backup_dir/$f" "$f"
            done
            git add $(existing_files)
            if git diff --cached --quiet; then
              echo "Remote zaten bu calistirmanin verisiyle ayni/daha taze - commit atlaniyor."
              pushed=1
              break
            fi
            git commit -m "gozcu: otomatik tarama $(date -u +'%Y-%m-%d %H:%M UTC')"
            attempt=$((attempt + 1))
            sleep 2
          done

          rm -rf "$backup_dir"

          if [ "$pushed" != "1" ]; then
            echo "::error::Push $max_attempts denemeden sonra basarisiz oldu."
            exit 1
          fi
